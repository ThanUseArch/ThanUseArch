<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bio Cá Nhân</title>
    <!-- Thêm icon từ FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #ffffff;
        }

        .container {
            width: 100%;
            max-width: 400px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 30px 20px;
            text-align: center;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        .profile-img {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #00d2ff;
            margin-bottom: 15px;
            box-shadow: 0 0 15px rgba(0, 210, 255, 0.5);
        }

        h1 {
            font-size: 22px;
            margin-bottom: 5px;
            letter-spacing: 0.5px;
        }

        .bio-text {
            font-size: 14px;
            color: #d1d5db;
            margin-bottom: 25px;
            line-height: 1.4;
        }

        .links-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .link-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 14px 20px;
            background: rgba(255, 255, 255, 0.1);
            color: #ffffff;
            text-decoration: none;
            border-radius: 12px;
            font-weight: 600;
            font-size: 15px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
        }

        .link-btn:hover {
            background: #00d2ff;
            color: #0f2027;
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0, 210, 255, 0.4);
        }

        .link-btn i {
            font-size: 18px;
        }

        footer {
            margin-top: 25px;
            font-size: 12px;
            color: #9ca3af;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Ảnh đại diện (Thay URL ảnh của bạn vào đây) -->
        <img src="https://via.placeholder.com/150" alt="Avatar" class="profile-img">

        <!-- Tên và Bio -->
        <h1>Tên Của Bạn</h1>
        <p class="bio-text">Lập trình viên / Creator / Yêu thích công nghệ 🚀</p>

        <!-- Danh sách liên kết -->
        <div class="links-container">
            <a href="https://github.com/username" target="_blank" class="link-btn">
                <i class="fab fa-github"></i> GitHub Profile
            </a>

            <a href="https://facebook.com" target="_blank" class="link-btn">
                <i class="fab fa-facebook"></i> Facebook Cá Nhân
            </a>

            <a href="https://tiktok.com" target="_blank" class="link-btn">
                <i class="fab fa-tiktok"></i> Kênh TikTok
            </a>

            <a href="mailto:email@example.com" class="link-btn">
                <i class="fas fa-envelope"></i> Liên Hệ Qua Email
            </a>
        </div>

        <footer>
            © 2026 Designed by Me
        </footer>
    </div>

</body>
</html>
